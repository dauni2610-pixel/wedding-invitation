    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecd8" />
    <title>정다운 ❤ 김수민 결혼합니다</title>
    <meta name="description" content="정다운 ♥ 김수민의 결혼식에 소중한 분들을 초대합니다." />

    <!-- Open Graph : 카카오톡/문자로 링크 공유 시 미리보기 -->
    <!-- 카카오톡 크롤러는 페이지를 렌더링하지 않고 이 태그들만 읽으므로,
         og:image는 반드시 (base path 포함한) 절대 URL이어야 합니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dauni2610-pixel.github.io/wedding-invitation/" />
    <meta property="og:title" content="정다운 ❤ 김수민 결혼합니다" />
    <meta property="og:description" content="2026년 12월 13일 일요일 오후 6시, 저희 두 사람의 새로운 시작에 초대합니다." />
    <meta property="og:image" content="https://dauni2610-pixel.github.io/wedding-invitation/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </body>
